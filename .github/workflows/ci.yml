name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    # Integration tests hit real Redis (IP blocklist, BullMQ transcode queue) and the
    # /api/health check runs SELECT 1 against Postgres - without these they hang or 503.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # src/db/index.ts builds its pool from SQL_* (DATABASE_URL is only for drizzle-kit)
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres_test
      SQL_HOST: 127.0.0.1
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_DB_NAME: postgres_test
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test
      - run: npm audit --audit-level=high
      - run: npm run build
